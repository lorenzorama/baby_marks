services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: baby
      POSTGRES_DB: baby_marks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d baby_marks"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://baby:baby@db:5432/baby_marks
      APP_SECRET_PHRASE: ${APP_SECRET_PHRASE:-change-me}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      APP_SECRET_PHRASE: ${APP_SECRET_PHRASE:-change-me}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
